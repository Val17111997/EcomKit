# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "12cef638ec0c369730c3c21c3372f0c9"
name = "ecom-kit"
handle = "ecom-kit-2"
application_url = "https://ecomkit.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-04"

[webhooks.app_uninstalled]
topic = "APP_UNINSTALLED"
path = "/webhooks"
delivery_method = "http"

[webhooks.app_subscriptions_update]
topic = "APP_SUBSCRIPTIONS_UPDATE"
path = "/webhooks"
delivery_method = "http"

[webhooks.orders_create]
topic = "ORDERS_CREATE"
path = "/webhooks"
delivery_method = "http"

# Webhooks GDPR obligatoires
[webhooks.customers_data_request]
topic = "CUSTOMERS_DATA_REQUEST"
path = "/webhooks/customers/data_request"
delivery_method = "http"

[webhooks.customers_redact]
topic = "CUSTOMERS_REDACT"
path = "/webhooks/customers/redact"
delivery_method = "http"

[webhooks.shop_redact]
topic = "SHOP_REDACT"
path = "/webhooks/shop/redact"
delivery_method = "http"

[access_scopes]
scopes = "write_products,read_products,read_orders,read_customers,write_payment_terms"

[auth]
redirect_urls = [
  "https://ecomkit.fly.dev/auth/callback",
  "https://ecomkit.fly.dev/auth/shopify/callback"
]

[pos]
embedded = false
